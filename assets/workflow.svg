<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="mv-title mv-desc">
<title id="mv-title">Mermaid Validate</title>
<desc id="mv-desc">Illustration: Mermaid source in a Markdown file is rendered to an actual node and edge diagram, then a validation report lists each fence with its source line and a pass or parse-error result. Catch broken diagrams before they reach your README.</desc>
<style>
.mv-s{font-family:"Avenir Next","Segoe UI","Helvetica Neue",Arial,sans-serif}
.mv-m{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace}
.mv-draw{stroke-dasharray:100;stroke-dashoffset:0;animation:mv-draw 8s ease-in-out infinite both}
.mv-d2{animation-delay:.9s}.mv-d3{animation-delay:1.8s}.mv-d4{animation-delay:2.7s}
@keyframes mv-draw{0%{stroke-dashoffset:100;opacity:1}30%{stroke-dashoffset:0;opacity:1}88%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
.mv-scan{animation:mv-scan 8s linear infinite}
@keyframes mv-scan{0%{transform:translateX(0)}60%{transform:translateX(324px)}100%{transform:translateX(324px)}}
.mv-hl{animation:mv-hl 8s steps(1,end) infinite}
@keyframes mv-hl{0%{transform:translateY(0)}12%{transform:translateY(26px)}24%{transform:translateY(52px)}36%{transform:translateY(78px)}48%{transform:translateY(104px)}60%,100%{transform:translateY(0)}}
.mv-pop{transform-box:fill-box;transform-origin:50% 50%;animation:mv-pop 8s ease-in-out infinite}
.mv-p2{animation-delay:.8s}.mv-p3{animation-delay:1.6s}
@keyframes mv-pop{0%,55%,100%{transform:scale(1)}65%{transform:scale(1.18)}78%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<pattern id="mv-dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#fff" fill-opacity=".28"/></pattern>
<pattern id="mv-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#FFF1D6"/><rect width="4" height="10" fill="#FFC21A" fill-opacity=".55"/></pattern>
</defs>
<rect width="1000" height="500" fill="#FFF1D6"/>
<rect x="0" y="470" width="1000" height="30" fill="url(#mv-hatch)"/>
<line x1="0" y1="470" x2="1000" y2="470" stroke="#14132B" stroke-width="3"/>

<!-- header -->
<text class="mv-s" x="44" y="76" font-size="50" font-weight="900" fill="#14132B" letter-spacing="-1">Mermaid Validate</text>
<rect x="44" y="86" width="150" height="8" fill="#FF2D95"/>
<text class="mv-s" x="44" y="124" font-size="19" font-weight="600" fill="#14132B">Catch broken diagrams before they reach your README.</text>
<g transform="rotate(-3 814 62)">
<rect x="664" y="40" width="300" height="44" fill="#14132B" transform="translate(5 5)"/>
<rect x="664" y="40" width="300" height="44" fill="#fff" stroke="#14132B" stroke-width="3"/>
<text class="mv-s" x="814" y="58" font-size="13" font-weight="800" fill="#FF2D95" text-anchor="middle" letter-spacing=".4">ILLUSTRATIVE / SYNTHETIC DATA</text>
<text class="mv-s" x="814" y="76" font-size="14" font-weight="700" fill="#14132B" text-anchor="middle">pinned Mermaid CLI 12.0.0</text>
</g>

<!-- 1 source -->
<rect x="50" y="158" width="246" height="294" fill="#14132B"/>
<rect x="44" y="152" width="246" height="294" fill="#fff" stroke="#14132B" stroke-width="3"/>
<rect x="44" y="152" width="246" height="34" fill="#FFC21A" stroke="#14132B" stroke-width="3"/>
<circle cx="62" cy="169" r="5" fill="#14132B"/><circle cx="78" cy="169" r="5" fill="#14132B"/><circle cx="94" cy="169" r="5" fill="#14132B"/>
<text class="mv-m" x="114" y="174" font-size="14" font-weight="700" fill="#14132B">README.md</text>
<rect class="mv-hl" x="47" y="222" width="240" height="26" fill="#2D4BFF" fill-opacity=".16"/>
<g class="mv-m" font-size="14">
<text x="62" y="209" fill="#8A86A8">```mermaid</text>
<text x="62" y="240" fill="#8A86A8">1</text><text x="84" y="240" fill="#E0147E" font-weight="700">flowchart LR</text>
<text x="62" y="266" fill="#8A86A8">2</text><text x="84" y="266" fill="#14132B">&#160;&#160;<tspan fill="#2D4BFF" font-weight="700">Draft</tspan> --&gt; <tspan fill="#2D4BFF" font-weight="700">Check</tspan></text>
<text x="62" y="292" fill="#8A86A8">3</text><text x="84" y="292" fill="#14132B">&#160;&#160;<tspan fill="#2D4BFF" font-weight="700">Check</tspan> --&gt;|ok| <tspan fill="#2D4BFF" font-weight="700">Share</tspan></text>
<text x="62" y="318" fill="#8A86A8">4</text><text x="84" y="318" fill="#14132B">&#160;&#160;<tspan fill="#2D4BFF" font-weight="700">Check</tspan> --&gt;|bad| <tspan fill="#2D4BFF" font-weight="700">Fix</tspan></text>
<text x="62" y="344" fill="#8A86A8">5</text><text x="84" y="344" fill="#14132B">&#160;&#160;<tspan fill="#2D4BFF" font-weight="700">Fix</tspan> --&gt; <tspan fill="#2D4BFF" font-weight="700">Draft</tspan></text>
<text x="62" y="370" fill="#8A86A8">```</text>
</g>
<line x1="60" y1="388" x2="274" y2="388" stroke="#14132B" stroke-width="2" stroke-dasharray="5 5"/>
<text class="mv-s" x="60" y="412" font-size="15" font-weight="700" fill="#14132B">Every ``` and ~~~ fence</text>
<text class="mv-s" x="60" y="433" font-size="15" fill="#14132B">checked with source lines</text>

<!-- arrows 1->2 -->
<path d="M297 296 h22 m-9 -10 l10 10 -10 10" fill="none" stroke="#14132B" stroke-width="4" stroke-linejoin="miter"/>

<!-- 2 rendered diagram -->
<rect x="332" y="158" width="360" height="294" fill="#14132B"/>
<rect x="326" y="152" width="360" height="294" fill="#2D4BFF" stroke="#14132B" stroke-width="3"/>
<rect x="326" y="152" width="360" height="294" fill="url(#mv-dots)"/>
<rect x="326" y="152" width="360" height="34" fill="#14132B"/>
<rect class="mv-scan" x="332" y="188" width="8" height="206" fill="#FFC21A"/>
<rect class="mv-scan" x="340" y="188" width="22" height="206" fill="#FFC21A" fill-opacity=".22"/>

<text class="mv-m" x="344" y="174" font-size="14" font-weight="700" fill="#fff">rendered SVG</text>
<text class="mv-s" x="668" y="174" font-size="14" font-weight="700" fill="#FFC21A" text-anchor="end">nodes + edges</text>

<g fill="none" stroke="#fff" stroke-width="3.5" stroke-opacity=".35">
<path d="M412 236 H462"/><path d="M554 236 H576"/><path d="M508 268 V340"/><path d="M463 360 H376 V258"/>
</g>
<g fill="none" stroke="#fff" stroke-width="3.5">
<path class="mv-draw" pathLength="100" d="M412 236 H462"/>
<path class="mv-draw mv-d2" pathLength="100" d="M554 236 H576"/>
<path class="mv-draw mv-d3" pathLength="100" d="M508 268 V340"/>
<path class="mv-draw mv-d4" pathLength="100" d="M463 360 H376 V258"/>
</g>
<g fill="#fff">
<polygon points="463,236 451,230 451,242"/><polygon points="587,236 575,230 575,242"/><polygon points="508,341 502,329 514,329"/><polygon points="376,257 370,269 382,269"/>
</g>
<g class="mv-s" font-size="14" font-weight="800" fill="#fff">
<text x="566" y="224" text-anchor="middle" fill="#FFC21A">ok</text>
<text x="520" y="312" fill="#FFC21A">bad</text>
<text x="388" y="318">retry</text>
</g>
<g stroke="#14132B" stroke-width="3">
<rect x="340" y="216" width="72" height="40" rx="8" fill="#fff"/>
<polygon points="508,204 554,236 508,268 462,236" fill="#FFC21A"/>
<rect x="587" y="216" width="84" height="40" rx="20" fill="#00D4C0"/>
<rect x="463" y="340" width="90" height="40" rx="8" fill="#FF2D95"/>
</g>
<g class="mv-s" font-size="15" font-weight="800" text-anchor="middle" fill="#14132B">
<text x="376" y="241">Draft</text><text x="508" y="241">Check</text><text x="629" y="241">Share</text>
<text x="508" y="365" fill="#fff">Fix</text>
</g>
<text class="mv-s" x="344" y="426" font-size="15" font-weight="700" fill="#fff">Renders &#8800; readable: still review layout.</text>

<!-- arrows 2->3 -->
<path d="M689 296 h22 m-9 -10 l10 10 -10 10" fill="none" stroke="#14132B" stroke-width="4"/>

<!-- 3 report -->
<rect x="728" y="158" width="228" height="294" fill="#14132B"/>
<rect x="722" y="152" width="228" height="294" fill="#fff" stroke="#14132B" stroke-width="3"/>
<rect x="722" y="152" width="228" height="34" fill="#FF2D95" stroke="#14132B" stroke-width="3"/>
<text class="mv-m" x="738" y="174" font-size="14" font-weight="700" fill="#fff">--json report</text>
<g stroke="#14132B" stroke-width="3">
<rect class="mv-pop" x="738" y="202" width="34" height="34" fill="#00D4C0"/>
<rect class="mv-pop mv-p2" x="738" y="266" width="34" height="34" fill="#00D4C0"/>
<rect class="mv-pop mv-p3" x="738" y="330" width="34" height="34" fill="#FF5B4A"/>
</g>
<g fill="none" stroke="#14132B" stroke-width="4.5" stroke-linecap="square">
<path d="M746 219 l6 7 10 -13"/><path d="M746 283 l6 7 10 -13"/>
<path d="M747 339 l16 16 M763 339 l-16 16" stroke="#fff"/>
</g>
<g class="mv-s" fill="#14132B">
<text x="784" y="216" font-size="16" font-weight="800">fence 1 · line 3</text><text x="784" y="236" font-size="14">SVG rendered</text>
<text x="784" y="280" font-size="16" font-weight="800">fence 2 · line 18</text><text x="784" y="300" font-size="14">SVG rendered</text>
<text x="784" y="344" font-size="16" font-weight="800">fence 3 · line 31</text><text x="784" y="364" font-size="14" font-weight="700" fill="#D1281A">parse error: fix</text>
</g>
<line x1="738" y1="384" x2="934" y2="384" stroke="#14132B" stroke-width="2" stroke-dasharray="5 5"/>
<text class="mv-m" x="738" y="410" font-size="14" font-weight="700" fill="#14132B">timeout per diagram</text>
<text class="mv-m" x="738" y="432" font-size="14" font-weight="700" fill="#14132B">exit code for CI</text>

<text class="mv-s" x="500" y="491" font-size="15" font-weight="800" fill="#14132B" text-anchor="middle" letter-spacing=".5">SOURCE  &#8594;  ACTUAL DIAGRAM  &#8594;  VALIDATION CHECK</text>
</svg>
